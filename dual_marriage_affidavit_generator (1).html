<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marriage Affidavit Generator</title>
<style>
:root{--ink:#202b45;--muted:#65718b;--blue:#3858d6;--violet:#7455d9;--line:#e1e7f2;--paper:#fff;--bg:#f4f6ff;--good:#147a4b;--bad:#b42318}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 12% 0%,#e7edff 0,transparent 35%),radial-gradient(circle at 100% 10%,#f0e7ff 0,transparent 30%),var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);min-height:100vh;padding:28px 16px}
.shell{max-width:900px;margin:0 auto}
.hero{text-align:center;padding:18px 12px 24px}
.eyebrow{display:inline-block;background:#e7eaff;color:#3449b6;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:7px 12px;border-radius:99px}
h1{font-size:clamp(28px,5vw,42px);margin:14px 0 8px;letter-spacing:-.035em}
.subtitle{color:var(--muted);margin:0 auto;max-width:620px;line-height:1.65}
.panel{background:rgba(255,255,255,.94);border:1px solid rgba(216,224,242,.9);border-radius:24px;box-shadow:0 18px 55px rgba(42,56,110,.09);padding:clamp(18px,4vw,34px);margin-bottom:24px}
.step-title{font-size:20px;margin:0 0 6px}.hint{margin:0 0 20px;color:var(--muted);font-size:14px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.choice{border:1px solid var(--line);border-radius:18px;padding:24px 18px;text-align:left;background:#fff;cursor:pointer;transition:.18s ease;min-height:160px;color:var(--ink)}
.choice:hover,.choice:focus-visible{transform:translateY(-2px);border-color:#9aa8f4;box-shadow:0 12px 28px rgba(56,88,214,.12);outline:none}
.choice .emoji{font-size:30px;display:block;margin-bottom:16px}.choice strong{display:block;font-size:20px;margin-bottom:7px}.choice span:last-child{color:var(--muted);font-size:13px;line-height:1.5}
#formPanel[hidden],#choicePanel[hidden]{display:none}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.selected-type{font-weight:800;color:#394dc4;background:#edf0ff;border-radius:99px;padding:8px 12px;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
button{font:inherit}
.back{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px;border-radius:10px;cursor:pointer;font-weight:650}
fieldset{border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0;background:#fff;min-width:0}
legend{font-weight:800;padding:0 8px;color:#3449b6}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
label{display:block;font-size:13px;font-weight:700;color:#3b4660}
input,textarea{display:block;width:100%;margin-top:7px;padding:12px 13px;border:1px solid #d6ddec;border-radius:10px;background:#fbfcff;color:var(--ink);font:inherit;font-size:14px;outline:none;transition:border .15s,box-shadow .15s}
textarea{resize:vertical;min-height:88px}
input:focus,textarea:focus{border-color:#7185ed;box-shadow:0 0 0 3px rgba(80,103,220,.13);background:#fff}
.full{grid-column:1/-1}
.actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:20px}
.generate{border:0;border-radius:12px;padding:13px 20px;color:white;font-weight:800;background:linear-gradient(115deg,var(--blue),var(--violet));box-shadow:0 8px 20px rgba(67,80,205,.24);cursor:pointer}
.generate:hover{filter:brightness(1.05);transform:translateY(-1px)}.generate:disabled{opacity:.65;cursor:wait;transform:none}
#status{margin-top:16px;padding:12px 14px;border-radius:12px;display:none;line-height:1.5;font-size:14px}
#status.show{display:block}#status.success{background:#e8f7ef;color:var(--good)}#status.error{background:#fff0ef;color:var(--bad)}#status.info{background:#edf2ff;color:#3547a8}
.footer{text-align:center;color:#7a849b;font-size:12px;padding:4px 12px 18px}
@media(max-width:620px){body{padding:16px 10px}.choices,.fields{grid-template-columns:1fr}.choice{min-height:0}.panel{border-radius:18px}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="shell">
  <section class="panel" id="choicePanel">
    <div class="choices">
      <button class="choice" type="button" data-kind="bride">
        <span class="emoji" aria-hidden="true">🌸</span>
        <strong>Bride</strong>
        <span>Use the original bride-format affidavit (3AMMAI.docx).</span>
      </button>
      <button class="choice" type="button" data-kind="groom">
        <span class="emoji" aria-hidden="true">🤵</span>
        <strong>Groom</strong>
        <span>Use the original groom-format affidavit (3ABBAI(3).docx).</span>
      </button>
    </div>
  </section>

  <section class="panel" id="formPanel" hidden>
    <div class="topline">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="selected-type" id="selectedType"></span>
        <button class="back" type="button" id="backButton">← Change</button>
      </div>
    </div>

    <form id="affidavitForm">
      <fieldset>
        <legend>Bridegroom details</legend>
        <div class="fields">
          <label>Full name<input name="groomName" autocomplete="name" required></label>
          <label>Date of birth<input name="groomDob" type="date" required></label>
          <label>Father's name<input name="groomFather" required></label>
          <label>Mother's name<input name="groomMother" required></label>
          <label class="full">Full residential address<textarea name="groomAddress" rows="2" required></textarea></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Bride details</legend>
        <div class="fields">
          <label>Full name<input name="brideName" autocomplete="name" required></label>
          <label>Date of birth<input name="brideDob" type="date" required></label>
          <label>Father's name<input name="brideFather" required></label>
          <label>Mother's name<input name="brideMother" required></label>
          <label class="full">Full residential address<textarea name="brideAddress" rows="2" required></textarea></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Marriage details</legend>
        <div class="fields">
          <label>Marriage date<input name="marriageDate" type="date" required></label>
          <label>Marriage time<input name="marriageTime" placeholder="e.g. 09:15 AM" required></label>
          <label class="full">Complete marriage venue address<textarea name="venue" rows="2" required></textarea></label>
          <label class="full">Custom of marriage<input name="custom" value="AS PER HINDU MARRIAGE CUSTOMS" required></label>
        </div>
      </fieldset>
      <div class="actions">
        <button class="generate" id="generateButton" type="submit">Generate DOCX</button>
        <span style="color:var(--muted);font-size:13px">The original templates remain unchanged.</span>
      </div>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
  </section>
</div>

function showStatus(message, type='info') {
  statusBox.textContent = message;
  statusBox.className = 'show ' + type;
}
function clearStatus(){ statusBox.textContent=''; statusBox.className=''; }
function formatDate(value, separator='-') {
  if (!value) return '';
  const [year, month, day] = value.split('-');
  return `${day}${separator}${month}${separator}${year}`;
}
function normalizeTime(value, style='normal') {
  let t = String(value || '').trim().toUpperCase().replace(/\s+/g,' ');
  t = t.replace(/(\d{1,2}):(\d{2})/, '$1.$2');
  if (style === 'groom') t = t.replace(/\s*(AM|PM)\b/, (_, ap) => ap === 'PM' ? ' P.M' : ' AM');
  return t;
}
function cleanAddress(value) {
  return String(value || '').trim().replace(/\r\n?/g,' ').replace(/\s+/g,' ');
}
function xmlTextEscape(value) {
  return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function getTextNodes(paragraph) {
  return Array.from(paragraph.getElementsByTagNameNS('http://schemas.openxmlformats.org/wordprocessingml/2006/main','t'));
}
function paragraphText(paragraph) {
  const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  let out='';
  for (const child of Array.from(paragraph.childNodes)) {
    if (child.nodeType===1 && child.namespaceURI===W) {
      if (child.localName==='r') {
        for (const rchild of Array.from(child.childNodes)) {
          if (rchild.nodeType===1 && rchild.namespaceURI===W) {
            if (rchild.localName==='t') out += rchild.textContent;
            else if (rchild.localName==='tab') out += '\t';
            else if (rchild.localName==='br') out += '\n';
          }
        }
      }
    }
  }
  return out;
}
// Replaces paragraph text while retaining paragraph properties and the first run's formatting.
// Existing paragraph properties (indentation, spacing, alignment) remain untouched.
function setParagraphTextPreservingParagraphFormatting(paragraph, value) {
  const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const runs=Array.from(paragraph.getElementsByTagNameNS(W,'r'));
  let firstRun=runs[0] || null;
  let runProps=firstRun ? Array.from(firstRun.childNodes).find(n=>n.nodeType===1 && n.namespaceURI===W && n.localName==='rPr') : null;
  runProps=runProps ? runProps.cloneNode(true) : null;
  for (const child of Array.from(paragraph.childNodes)) {
    if (!(child.nodeType===1 && child.namespaceURI===W && child.localName==='pPr')) paragraph.removeChild(child);
  }
  const parts=String(value).split('\t');
  let run=paragraph.ownerDocument.createElementNS(W,'w:r');
  if (runProps) run.appendChild(runProps);
  paragraph.appendChild(run);
  parts.forEach((part,index)=>{
    if (index>0) {
      const tab=paragraph.ownerDocument.createElementNS(W,'w:tab');
      run.appendChild(tab);
    }
    if (part) {
      const t=paragraph.ownerDocument.createElementNS(W,'w:t');
      if (/^\s|\s$|  /.test(part)) t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');
      t.textContent=part; run.appendChild(t);
    }
  });
}
function setParagraphValueAfterColon(paragraph, value) {
  const text=paragraphText(paragraph);
  const colon=text.lastIndexOf(':');
  if (colon < 0) throw new Error('Could not identify a field value in the selected template.');
  const label=text.slice(0,colon+1);
  setParagraphTextPreservingParagraphFormatting(paragraph, label + ' ' + value);
}
function bodyParagraphs(doc) {
  const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const body=doc.getElementsByTagNameNS(W,'body')[0];
  return Array.from(body.children).filter(el=>el.namespaceURI===W && el.localName==='p');
}
function setPara(doc, index, value) {
  const paras=bodyParagraphs(doc);
  if (!paras[index]) throw new Error('The selected original template has an unexpected structure (paragraph '+index+').');
  setParagraphTextPreservingParagraphFormatting(paras[index], value);
}
function setField(doc, index, value) {
  const paras=bodyParagraphs(doc);
  if (!paras[index]) throw new Error('The selected original template is missing a required field.');
  setParagraphValueAfterColon(paras[index], value);
}
function replaceMarriageLines(doc, indexes, date, time, venue, kind) {
  const paras=bodyParagraphs(doc);
  const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const first=paras[indexes[0]];
  if (!first) throw new Error('Could not find the marriage details in the original template.');
  const oldText=paragraphText(first);
  const colon=oldText.indexOf(':');
  const label = colon >= 0 ? oldText.slice(0,colon+1) : 'Date, time and Place of the marriage  :';
  const dateText = kind==='groom' ? formatDate(date,'/') : formatDate(date,'-');
  let timeText = normalizeTime(time,kind);
  if (kind==='groom') timeText = timeText.replace(/\s+(AM|P\.M)\b/, (_, ap) => ap === 'AM' ? ' AM' : ' P.M');
  const prefix = `  On ${dateText} at ${timeText} at, `;
  const available = indexes.map(i=>paras[i]).filter(Boolean);
  const oldLines = indexes.slice(1).map(i=>paragraphText(paras[i]) || '');
  const indents = oldLines.map(t => (t.match(/^\s*/) || [''])[0] || '                                                                           ');
  // Preserve the original field label and its tab stops on the first line. Only the
  // variable date/time/venue text is changed; continuation paragraphs remain in place.
  const venueWords = cleanAddress(venue).split(/\s+/).filter(Boolean);
  const firstBudget = kind==='bride' ? 48 : 48;
  const continuationBudget = kind==='bride' ? 66 : 66;
  const chunks=[];
  let current='', budget=firstBudget;
  for (const word of venueWords) {
    if (!current) current=word;
    else if ((current+' '+word).length <= budget) current += ' '+word;
    else { chunks.push(current); current=word; budget=continuationBudget; }
  }
  if (current) chunks.push(current);
  setParagraphTextPreservingParagraphFormatting(available[0], label + prefix + (chunks.shift() || ''));
  for (let i=1;i<available.length;i++) {
    setParagraphTextPreservingParagraphFormatting(available[i], chunks[i-1] ? (indents[i-1] || '                                                                           ') + chunks[i-1] : '');
  }
  // If an unusually long venue exceeds the original number of continuation lines,
  // append the remaining words to the last existing line so no information is lost.
  if (chunks.length > available.length-1) {
    const last=available[available.length-1];
    const existing=paragraphText(last);
    const extra=chunks.slice(available.length-1).join(' ');
    setParagraphTextPreservingParagraphFormatting(last, existing + (existing ? ' ' : '') + extra);
  }
}
async function generateDocument(data, kind) {
  const template64 = kind==='bride' ? BRIDE_TEMPLATE_BASE64 : GROOM_TEMPLATE_BASE64;
  const zip=await JSZip.loadAsync(Uint8Array.from(atob(template64),c=>c.charCodeAt(0)));
  const xml=await zip.file('word/document.xml').async('text');
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('The original DOCX template could not be read.');
  const date=formatDate(data.marriageDate,'-');
  const time=normalizeTime(data.marriageTime,'bride');
  const groomAddress=cleanAddress(data.groomAddress);
  const brideAddress=cleanAddress(data.brideAddress);
  const venue=cleanAddress(data.venue);
  if (kind==='bride') {
    // 3AMMAI.docx: bride is the deponent and is listed first in the particulars.
    setPara(doc,17,` I, ${data.brideName.trim()} , D/o. ${data.brideFather.trim()}, ${brideAddress}. do hereby solemnly affirm and state on oath as under.`);
    setPara(doc,18,`I hereby declare that I was married to ${data.groomName.trim()}, S/.O ${data.groomFather.trim()}, resident of ${groomAddress}. On ${date} at ${time} at, ${venue}. Particulars of marriage are as under`);
    setField(doc,19,data.brideName.trim());
    setField(doc,20,formatDate(data.brideDob));
    setField(doc,21,data.brideFather.trim());
    setField(doc,22,data.brideMother.trim());
    setField(doc,24,data.groomName.trim());
    setField(doc,25,formatDate(data.groomDob));
    setField(doc,26,data.groomFather.trim());
    setField(doc,27,data.groomMother.trim());
    replaceMarriageLines(doc,[28,29,30,31],data.marriageDate,data.marriageTime,venue,'bride');
    setField(doc,32,data.custom.trim());
  } else {
    // 3ABBAI(3).docx: groom is the deponent and is listed first in the particulars.
    setPara(doc,2,` I, ${data.groomName.trim()}, S/.O ${data.groomFather.trim()}, resident of ${groomAddress}. do hereby solemnly affirm and state on oath as under.`);
    setPara(doc,3,`I hereby declare that I was married to ${data.brideName.trim()}, D/o. ${data.brideFather.trim()}, R/O ${brideAddress}. On ${date} at ${time} at, ${venue} Particulars of marriage are as under`);
    setField(doc,4,data.groomName.trim());
    setField(doc,5,formatDate(data.groomDob));
    setField(doc,6,data.groomFather.trim());
    setField(doc,7,data.groomMother.trim());
    setField(doc,9,data.brideName.trim());
    setField(doc,10,formatDate(data.brideDob));
    setField(doc,11,data.brideFather.trim());
    setField(doc,12,data.brideMother.trim());
    replaceMarriageLines(doc,[13,14,15],data.marriageDate,data.marriageTime,venue,'groom');
    setField(doc,16,data.custom.trim());
  }
  // Some source templates contain many empty paragraphs before the title.
  // Remove only leading empty body paragraphs so the affidavit starts near the top.
  const W_NS='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const body=doc.getElementsByTagNameNS(W_NS,'body')[0];
  if (body) {
    while (body.firstElementChild && body.firstElementChild.namespaceURI===W_NS &&
           body.firstElementChild.localName==='p' &&
           !Array.from(body.firstElementChild.getElementsByTagNameNS(W_NS,'t')).some(t => (t.textContent||'').trim())) {
      body.removeChild(body.firstElementChild);
    }
  }
  zip.file('word/document.xml',new XMLSerializer().serializeToString(doc));
  return await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',compression:'DEFLATE'});
}
form.addEventListener('submit',async event=>{
  event.preventDefault();
  if (!selectedKind) { showStatus('Please choose Bride or Groom first.','error'); return; }
  const data=Object.fromEntries(new FormData(form).entries());
  for (const key of ['groomName','groomDob','groomFather','groomMother','groomAddress','brideName','brideDob','brideFather','brideMother','brideAddress','marriageDate','marriageTime','venue','custom']) {
    if (!String(data[key]||'').trim()) { showStatus('Please complete all required fields before generating the DOCX.','error'); return; }
  }
  generateButton.disabled=true; generateButton.textContent='Generating…'; showStatus('Preparing your original template…','info');
  try {
    const blob=await generateDocument(data,selectedKind);
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url;
    a.download=selectedKind==='bride' ? 'Bride_Affidavit.docx' : 'Groom_Affidavit.docx';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000);
    showStatus((selectedKind==='bride'?'Bride':'Groom')+' affidavit generated and downloaded. The original template file was not changed. Please review it in Word before signing or official submission.','success');
  } catch(error) {
    console.error(error);
    showStatus('Could not generate the DOCX: '+(error?.message||'Unexpected error. Please try again.'),'error');
  } finally { generateButton.disabled=false; generateButton.textContent='Generate DOCX'; }
});
</script>
